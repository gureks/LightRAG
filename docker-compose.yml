services:
  alloydb:
    image: google/alloydbomni:16
    container_name: lightrag-alloydb
    shm_size: 1gb
    ports:
      - "${ALLOYDB_HOST_PORT:-5432}:5432"
    env_file:
      - ./.env
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}"
      POSTGRES_DB: "${POSTGRES_DATABASE:-postgres}"
    volumes:
      - ./data/alloydb:/var/lib/postgresql/data
      - ./data/alloydb_init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  # Optional sidecar for connecting directly to a remote GCP AlloyDB for PostgreSQL cluster
  # without any LightRAG codebase changes. Activate with:
  #   ALLOYDB_INSTANCE_URI=projects/<PROJECT>/locations/<REGION>/clusters/<CLUSTER>/instances/<INSTANCE> \
  #   POSTGRES_HOST=alloydb-auth-proxy docker compose --profile gcp-cloud up -d
  alloydb-auth-proxy:
    image: gcr.io/alloydb-connectors/alloydb-auth-proxy:latest
    container_name: lightrag-alloydb-proxy
    profiles: ["gcp-cloud"]
    command:
      - "${ALLOYDB_INSTANCE_URI:-projects/PROJECT/locations/REGION/clusters/CLUSTER/instances/INSTANCE}"
      - "--address=0.0.0.0"
      - "--port=5432"
    ports:
      - "5433:5432"
    restart: on-failure

  lightrag:
    image: ghcr.io/hkuds/lightrag:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        WEBUI_DIR: "${WEBUI_DIR:-lightrag_webui_v2}"
      tags:
        - ghcr.io/hkuds/lightrag:latest
    depends_on:
      alloydb:
        condition: service_healthy
    ports:
      - "${HOST:-0.0.0.0}:${PORT:-9621}:9621"
    volumes:
      - ./data/rag_storage:/app/data/rag_storage
      - ./data/inputs:/app/data/inputs
      - ./data/prompts:/app/data/prompts
      - ./lightrag/api/webui:/app/lightrag/api/webui:ro
      # Optional user-defined UI content bundle (welcome page, login blurb
      # and user agreement, query empty state, brand logo). Read-only: the
      # server only ever reads it. See docs/UserDefinedUI.md.
      - ./data/ui_templates:/app/data/ui_templates:ro
      - ./.env:/app/.env
    deploy:
      restart_policy:
        condition: on-failure
        max_attempts: 10
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      WORKING_DIR: "/app/data/rag_storage"
      INPUT_DIR: "/app/data/inputs"
      PROMPT_DIR: "/app/data/prompts"
      # The container must listen on 0.0.0.0 to be reachable via the published port.
      # SECURITY: set LIGHTRAG_API_KEY (or AUTH_ACCOUNTS with TOKEN_SECRET) in .env
      # so the exposed server is authenticated — without it every endpoint is public.
      HOST: "0.0.0.0"
      PORT: "9621"
      # Loads user-defined UI content from the read-only bundle mounted above.
      # Inert until ./data/ui_templates holds a bundle: with no manifest.json
      # in it the server logs a warning and keeps the built-in LightRAG
      # branding. Once a manifest.json is there an invalid bundle makes the
      # server refuse to start. This entry deliberately overrides the same key
      # in the mounted .env, exactly like WORKING_DIR / INPUT_DIR / PROMPT_DIR:
      # .env holds host paths so one file can serve both a source run and this
      # deployment, and compose supplies the container path.
      # See docs/UserDefinedUI.md.
      UI_TEMPLATES_DIR: "/app/data/ui_templates"
      LOG_FORMAT: "${LOG_FORMAT:-json}"

  # Reverse proxy providing *.uncode.local hostnames on port 80
  caddy:
    image: caddy:2-alpine
    container_name: uncode-caddy
    ports:
      - "${UNCODE_HTTP_PORT:-80}:80"
    volumes:
      - ./observability/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - lightrag
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: uncode-prometheus
    profiles: ["observability"]
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    restart: unless-stopped

  loki:
    image: grafana/loki:3.3.2
    container_name: uncode-loki
    profiles: ["observability"]
    ports:
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - ./observability/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.3.2
    container_name: uncode-promtail
    profiles: ["observability"]
    volumes:
      - ./observability/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.1
    container_name: uncode-grafana
    profiles: ["observability"]
    env_file:
      - ./.env
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set in .env}"
      GF_SERVER_ROOT_URL: "http://grafana.uncode.local"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

  langfuse:
    image: langfuse/langfuse:2
    container_name: uncode-langfuse
    profiles: ["observability"]
    env_file:
      - ./.env
    ports:
      - "${LANGFUSE_PORT:-3001}:3000"
    environment:
      PORT: "3000"
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}"
      NEXTAUTH_URL: "${LANGFUSE_NEXTAUTH_URL:-http://langfuse.uncode.local}"
      NEXTAUTH_SECRET: "${LANGFUSE_NEXTAUTH_SECRET:?LANGFUSE_NEXTAUTH_SECRET must be set in .env}"
      SALT: "${LANGFUSE_SALT:?LANGFUSE_SALT must be set in .env}"
      ENCRYPTION_KEY: "${LANGFUSE_ENCRYPTION_KEY:?LANGFUSE_ENCRYPTION_KEY must be set in .env}"
      TELEMETRY_ENABLED: "false"
    entrypoint:
      - node
      - -e
      - |
        const { spawnSync } = require("child_process");
        const u = encodeURIComponent(process.env.POSTGRES_USER || "postgres");
        const p = encodeURIComponent(process.env.POSTGRES_PASSWORD || "");
        process.env.DATABASE_URL = process.env.LANGFUSE_DATABASE_URL || `postgresql://$${u}:$${p}@alloydb:5432/langfuse`;
        const res = spawnSync("dumb-init", ["--", "./web/entrypoint.sh", "node", "./web/server.js", "--keepAliveTimeout", "110000"], { stdio: "inherit", env: process.env });
        process.exit(res.status ?? 1);
    depends_on:
      alloydb:
        condition: service_healthy
    restart: unless-stopped

volumes:
  prometheus_data:
  loki_data:
  grafana_data:
